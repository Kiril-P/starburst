<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STARBURST: Bullet Hell Mayhem</title>
    <meta name="description" content="A neon pixel-art bullet hell: dodge dense bullet patterns, graze for combo, and upgrade your ship between waves.">
    <meta name="theme-color" content="#070b1a">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:type" content="website">
    <meta property="og:title" content="STARBURST: Bullet Hell Mayhem">
    <meta property="og:description" content="Dodge dense bullet patterns, graze for combo, and upgrade your ship between waves. Play free in your browser.">
    <meta property="og:url" content="https://kpetrovski.me/play/starburst/">
    <meta property="og:image" content="https://kpetrovski.me/play/starburst/og-image.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #070b1a;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="module" src="/src/game.js"></script>
</body>
</html>
