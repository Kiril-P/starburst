<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:var(--foreground,#eaf6ff);font:14px system-ui,sans-serif}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;border:1px solid #385572;background:#10182b;color:#c4d4ee;padding:8px 12px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{border-color:#39e7ff;color:#39e7ff}figure{margin:0}img{display:none;width:100%;height:auto;border-radius:8px}img.active{display:block}figcaption{padding:8px 0;color:var(--muted-foreground,#9caaca);font-size:12px}</style></head><body><nav aria-label="Concept screens"><button aria-pressed="true" onclick="pick(0)">Gameplay</button><button aria-pressed="false" onclick="pick(1)">Title</button><button aria-pressed="false" onclick="pick(2)">Boss</button><button aria-pressed="false" onclick="pick(3)">Upgrades</button><button aria-pressed="false" onclick="pick(4)">Style sheet</button><button aria-pressed="false" onclick="pick(5)">Game over</button></nav><figure><img class="active" src="concept-art/01-gameplay-intense.png" alt="STARBURST Gameplay concept"><img class="" src="concept-art/02-title-screen.png" alt="STARBURST Title concept"><img class="" src="concept-art/03-boss-fight.png" alt="STARBURST Boss concept"><img class="" src="concept-art/04-upgrade-screen.png" alt="STARBURST Upgrades concept"><img class="" src="concept-art/05-sprite-sheet.png" alt="STARBURST Style sheet concept"><img class="" src="concept-art/06-game-over.png" alt="STARBURST Game over concept"><figcaption id="caption">01-gameplay-intense.png · Native 1672 × 941</figcaption></figure><script>const names=["01-gameplay-intense.png","02-title-screen.png","03-boss-fight.png","04-upgrade-screen.png","05-sprite-sheet.png","06-game-over.png"];function pick(n){document.querySelectorAll('img').forEach((x,i)=>x.classList.toggle('active',i===n));document.querySelectorAll('button').forEach((x,i)=>x.setAttribute(
